name: Cast Branch Debug Build

on:
  push:
    branches: [feature/upnp-cast]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cast-branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shrunk-arm64-build:
    name: Build shrunk arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build shrunk arm64 APK (R8 + resource shrinking, debug-signed)
        run: ./gradlew :androidApp:assembleFullBenchmark -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.abis=arm64-v8a --stacktrace

      - name: Collect APK and report size
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/benchmark/*arm64-v8a*.apk | head -n 1)
          cp "$APK" app-arm64-shrunk.apk
          SIZE=$(du -h app-arm64-shrunk.apk | cut -f1)
          echo "APK size: $SIZE"
          echo "### Shrunk arm64 APK: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -lv app-arm64-shrunk.apk | sort -k3 -n -r | head -n 15 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shrunk APK
        uses: actions/upload-artifact@v7
        with:
          path: app-arm64-shrunk.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

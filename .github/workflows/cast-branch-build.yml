name: Cast Branch Debug Build

on:
  push:
    branches: [feature/upnp-cast]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cast-branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Report APK size
        run: |
          SIZE=$(du -h androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk | cut -f1)
          echo "### fullDebug APK: $SIZE (before artifact compression)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fullDebug APK (max compression)
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-full-debug
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          compression-level: 9
          if-no-files-found: error
          retention-days: 7

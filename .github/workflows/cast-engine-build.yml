name: Cast Engine Build

on:
  push:
    branches: [cast-engine]
  workflow_dispatch:
    inputs:
      variant:
        description: "debug = the normal build (default). benchmark = minified with R8, smaller but riskier."
        type: choice
        options: [debug, benchmark]
        default: debug

permissions:
  contents: read

concurrency:
  group: cast-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: Build full APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # No submodules: MPVKit is iOS-only and libass-android is an orphan
      # gitlink (no .gitmodules entry) that breaks a recursive checkout.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      # The only size change in the default build is dropping the native libraries of other
      # CPU architectures (arm64-v8a is what phones use). No code is removed or renamed, so
      # the app behaves exactly like the plain debug build.
      # gradle.properties asks for a 12 GB Gradle daemon plus an 8 GB Kotlin daemon, more than
      # the 16 GB runner has, so Kotlin runs inside one 7 GB daemon instead.
      - name: Build APK
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          TASK="assembleFull$(echo "${VARIANT:0:1}" | tr a-z A-Z)${VARIANT:1}"
          ./gradlew ":androidApp:${TASK}" \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pnuvio.abiFilter=arm64-v8a \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --parallel --stacktrace

      - name: APK size
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/${VARIANT}/*.apk | head -n1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          echo "### APK size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuviocast-full-${{ inputs.variant || 'debug' }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7

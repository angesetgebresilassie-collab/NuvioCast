name: Cast Engine Build

on:
  push:
    branches: [cast-engine, cast-stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cast-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      # No submodules: MPVKit is iOS-only and libass-android is an orphan
      # gitlink (no .gitmodules entry) that breaks a recursive checkout.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Every CI run starts on a fresh machine, and Android generates a brand-new random debug
      # key on a fresh machine, so each APK used to be signed differently and could not be
      # installed over the previous one. One fixed debug key makes every build an in-place update.
      - name: Install fixed debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: nuviocast-full-debug
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 7
